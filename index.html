<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <h1>Student Management System</h1>

        <p class="subtitle">
            Add, View, Edit, Delete and Manage Student Details
        </p>


        <!-- Search Box -->
        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search by Name, Roll Number, Email or Branch..."
                onkeyup="searchStudent()"
            >
        </div>


        <!-- Registration + Student Details -->
        <div class="top-cards">

            <!-- Student Registration -->
            <div class="registration">

                <h2>Student Registration</h2>

                <form>

                    <label>Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter name"
                    >

                    <label>Roll Number</label>
                    <input
                        type="text"
                        id="roll"
                        placeholder="Enter roll number"
                    >

                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                    <label>Branch</label>
                    <input
                        type="text"
                        id="branch"
                        placeholder="Enter branch"
                    >

                    <div class="buttons">

                        <button
                            type="button"
                            onclick="registerStudent()"
                        >
                            Register Student
                        </button>

                        <button
                            type="button"
                            onclick="updateStudent()"
                        >
                            Update
                        </button>

                        <button
                            type="button"
                            onclick="clearForm()"
                        >
                            Clear
                        </button>

                    </div>

                </form>

            </div>


            <!-- Student Details -->
            <div class="student-details">

                <h2>Student Details</h2>

                <div class="student-count-circle">
                    <span id="studentCountNumber">0</span>
                </div>

                <h3>Total Students</h3>

                <p id="studentCount">
                    Total Students: 0
                </p>

                <p>Currently in the System</p>

            </div>

        </div>


        <!-- Student List Table -->
        <div class="student-list">

            <h2>Student List</h2>

            <table id="studentTable">

                <tr>
                    <th>Name</th>
                    <th>Roll Number</th>
                    <th>Email</th>
                    <th>Branch</th>
                    <th>Actions</th>
                </tr>

            </table>

        </div>

    </div>

</body>
</html>
